name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Tangelo version, placeholder: "1.0.0" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version, placeholder: "macOS 26.3" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "Tool or conversion used, file type, and the error shown." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output (optional)
      description: "Output of: /Applications/Tangelo.app/Contents/MacOS/Tangelo --selftest /tmp/tangelo-selftest"
      render: text
