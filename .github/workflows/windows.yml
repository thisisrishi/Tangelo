name: Windows
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_call:
    inputs:
      version: { type: string, required: true }

jobs:
  build-test-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install ffmpeg and Inno Setup
        run: choco install ffmpeg innosetup -y --no-progress
      - name: Fetch model
        run: ./scripts/fetch-model.ps1
      - name: Build
        run: dotnet build Tangelo.slnx -c Release
      - name: Engine self-test (with Windows OCR)
        run: dotnet run --project src/Tangelo.SelfTest -c Release -f net10.0-windows10.0.19041.0 --no-build -- "$env:RUNNER_TEMP\selftest"
      - name: Package (self-contained app, bundled ffmpeg, installer, portable zip)
        run: |
          $v = "${{ inputs.version }}".TrimStart('v'); if (-not $v) { $v = '0.0.0' }
          ./scripts/package.ps1 -Version $v
      - name: Self-test the packaged app (bundled ffmpeg)
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'ffmpeg|chocolatey\\bin' }) -join ';'
          $p = Start-Process artifacts\Tangelo\Tangelo.exe -ArgumentList '--selftest', "$env:RUNNER_TEMP\pkgtest" -PassThru -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\pkgtest.log"
          Get-Content "$env:RUNNER_TEMP\pkgtest.log" | Select-String 'FAIL|SKIP|ALL|FAILED'
          if ($p.ExitCode -ne 0) { throw "packaged self-test failed ($($p.ExitCode))" }
      - name: Screenshots
        run: ./scripts/screenshots.ps1 -Exe "$PWD\artifacts\Tangelo\Tangelo.exe" -Samples "$env:RUNNER_TEMP\pkgtest" -Out "$PWD\artifacts\screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: tangelo-windows
          path: |
            windows/artifacts/*.exe
            windows/artifacts/*.zip
            windows/artifacts/screenshots/*.png
