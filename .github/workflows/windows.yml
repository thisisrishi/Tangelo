name: Windows
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Fetch model
        run: ./scripts/fetch-model.ps1
      - name: Build
        run: dotnet build Tangelo.slnx -c Release
      - name: Engine self-test (with Windows OCR)
        run: dotnet run --project src/Tangelo.SelfTest -c Release -f net10.0-windows10.0.19041.0 --no-build -- "$env:RUNNER_TEMP\selftest"
