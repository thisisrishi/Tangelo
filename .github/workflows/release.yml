name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app, DMG and zip
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: Self-test release binary
        run: build/Tangelo.app/Contents/MacOS/Tangelo --selftest "$RUNNER_TEMP/selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: tangelo-macos
          path: |
            build/Tangelo.dmg
            build/Tangelo.zip

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets and checksums
        run: |
          mkdir -p upload
          cp dist/tangelo-macos/Tangelo.dmg dist/tangelo-macos/Tangelo.zip upload/
          cp dist/tangelo-windows/*.exe dist/tangelo-windows/*.zip upload/
          cd upload && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" upload/* --title "Tangelo ${GITHUB_REF_NAME#v}" --notes "$notes"
